[[field]]
key = "admin_user"
type = "string"
requirement = "optional"
default = "admin"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Username for the /admin console login. The password is set separately with `hipfire admin set-password` (argon2id hash stored in ~/.hipfire/admin.passwd, never in config)."
secret = false
restart_impact = "none"

[[field]]
key = "api_auth_mode"
type = "enum(auto|off|optional|required)"
requirement = "optional"
default = "auto"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "API credential policy. auto allows anonymous API calls only on loopback and requires credentials on non-loopback binds; off, optional, and required are explicit overrides."
validation = "one of: auto, off, optional, required"
secret = false
restart_impact = "none"

[[field]]
key = "cask"
type = "bool"
requirement = "optional"
default = "false"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Enable CASK/TriAttention behavior where supported."
secret = false
restart_impact = "none"

[[field]]
key = "cask_auto_attach"
type = "bool"
requirement = "optional"
default = "true"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Whether compatible CASK/TriAttention sidecars may auto-attach."
secret = false
restart_impact = "none"

[[field]]
key = "cask_beta"
type = "u32"
requirement = "optional"
default = "128"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "CASK beta control value."
secret = false
restart_impact = "none"

[[field]]
key = "cask_budget"
type = "u32"
requirement = "optional"
default = "512"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "CASK token or block budget."
secret = false
restart_impact = "none"

[[field]]
key = "cask_core_frac"
type = "f64"
requirement = "optional"
default = "0.5"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Fraction of CASK core candidates to keep."
validation = "0.0..=1.0"
secret = false
restart_impact = "none"

[[field]]
key = "cask_fold_m"
type = "u32"
requirement = "optional"
default = "2"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "CASK fold factor."
secret = false
restart_impact = "none"

[[field]]
key = "cask_sidecar"
type = "path"
requirement = "required when `cask == true && cask_auto_attach == false`"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Explicit CASK/TriAttention sidecar path."
secret = false
restart_impact = "none"

[[field]]
key = "cors_allowed_origins"
type = "json"
requirement = "optional"
default = "[]"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Browser origins allowed to call the HTTP API cross-origin. Empty disables CORS (same-origin only); [\"*\"] allows any origin; otherwise an explicit allowlist such as [\"http://localhost:8080\"]."
validation = "JSON array of origin strings, or [\"*\"]"
secret = false
restart_impact = "none"

[[field]]
key = "default_model"
type = "string"
requirement = "optional"
scopes = ["global", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Model tag, alias, or path to use when a request omits the model."
secret = false
restart_impact = "none"

[[field]]
key = "dflash_adaptive_b"
type = "bool"
requirement = "optional"
default = "true"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Whether DFlash may adapt draft batch size."
secret = false
restart_impact = "none"

[[field]]
key = "dflash_mode"
type = "enum(off|auto|on)"
requirement = "optional"
default = "off"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "DFlash speculative decode mode."
secret = false
restart_impact = "none"

[[field]]
key = "dflash_ngram_block"
type = "json"
requirement = "optional"
default = "\"auto\""
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "DFlash n-gram blocking policy; accepts boolean or auto."
secret = false
restart_impact = "none"

[[field]]
key = "flash_mode"
type = "enum(auto|always|never)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Flash-attention selection policy."
secret = false
restart_impact = "none"

[[field]]
key = "gpu_slab_load"
type = "enum(auto|off|on)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "GPU slab loading policy for model weights."
secret = false
restart_impact = "none"

[[field]]
key = "host"
type = "string"
requirement = "optional"
default = "127.0.0.1"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Bind host for the OpenAI-compatible HTTP server. Defaults to loopback; set to 0.0.0.0 to expose on all interfaces."
validation = "valid IP address or hostname"
secret = false
restart_impact = "none"

[[field]]
key = "kv_adaptive"
type = "enum(off|auto)"
requirement = "optional"
default = "off"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Adaptive KV-cache policy."
secret = false
restart_impact = "none"

[[field]]
key = "kv_cache"
type = "enum(auto|q8|asym2|asym3|asym4|kvarn2|kvarn|kvarn4|kvarn8)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "KV-cache precision and memory policy."
secret = false
restart_impact = "none"

[[field]]
key = "max_seq"
type = "u32"
requirement = "optional"
default = "8192"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Maximum context/KV-cache capacity allocated at model load."
secret = false
restart_impact = "none"

[[field]]
key = "max_tokens"
type = "u32"
requirement = "optional"
default = "512"
scopes = ["global", "model", "request"]
mutability = "request_only"
owner = "hipfire-config"
description = "Default maximum number of generated tokens per request."
secret = false
restart_impact = "none"

[[field]]
key = "mmq_screen"
type = "enum(auto|off|on)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "MMQ safety screening mode."
secret = false
restart_impact = "none"

[[field]]
key = "mmq_screen_threshold"
type = "f64"
requirement = "optional"
default = "0.10"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "MMQ screening rejection threshold."
validation = "0.0..=1.0"
secret = false
restart_impact = "none"

[[field]]
key = "model_overrides"
type = "json"
requirement = "optional"
default = "{}"
scopes = ["global", "model"]
mutability = "load_time"
owner = "hipfire-config"
description = "Sparse per-model override map layered on top of global config."
validation = "object keyed by model tag"
secret = false
restart_impact = "reload_model"

[[field]]
key = "model_residency_mode"
type = "enum(auto|full|qwen_moe_modules)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Model residency strategy selected by the scheduler."
secret = false
restart_impact = "none"

[[field]]
key = "models_dir"
type = "path"
requirement = "optional"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Primary local model root. When unset, Hipfire uses ~/.hipfire/models."
secret = false
restart_impact = "none"

[[field]]
key = "models_network_dir"
type = "path"
requirement = "optional"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Optional extra read-only model root (e.g. an NFS share such as /srv/hipfire). When set, the network-facing server routes resolve model identifiers within this root in addition to models_dir. Unset by default; local CLI/eval callers are unaffected."
secret = false
restart_impact = "none"

[[field]]
key = "mtp_k"
type = "u32"
requirement = "optional"
default = "3"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Number of MTP candidate tokens to consider."
secret = false
restart_impact = "none"

[[field]]
key = "mtp_mode"
type = "enum(auto|off|on)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Multi-token prediction sidecar mode."
secret = false
restart_impact = "none"

[[field]]
key = "port"
type = "u16"
requirement = "optional"
default = "11435"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Bind port for the OpenAI-compatible HTTP server."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_alpha"
type = "f64"
requirement = "optional"
default = "0.85"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Prefill compression scoring alpha."
validation = "0.0..=1.0"
secret = false
restart_impact = "none"

[[field]]
key = "prefill_block"
type = "u32"
requirement = "optional"
default = "128"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Block size used by prefill compression."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_compression"
type = "enum(off|auto|on)"
requirement = "optional"
default = "off"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Long-context prefill compression mode."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_drafter"
type = "path"
requirement = "required when `prefill_compression != 'off' && prefill_drafter_device >= 0`"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Optional drafter artifact for prefill compression."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_drafter_device"
type = "i32"
requirement = "optional"
default = "-1"
scopes = ["global", "host", "node", "model"]
mutability = "load_time"
owner = "hipfire-config"
description = "Preferred accelerator device for the prefill drafter."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_keep_ratio"
type = "f64"
requirement = "optional"
default = "0.05"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Fraction of prefill blocks to keep under compression."
validation = "0.0..=1.0"
secret = false
restart_impact = "none"

[[field]]
key = "prefill_min_keep"
type = "u32"
requirement = "optional"
default = "2048"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Minimum tokens or blocks retained during prefill compression."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_profile"
type = "bool"
requirement = "optional"
default = "false"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Emit prefill compression profiling details."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_recent"
type = "u32"
requirement = "optional"
default = "1024"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Recent context size retained during prefill compression."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_sink"
type = "u32"
requirement = "optional"
default = "256"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Prefix sink size retained during prefill compression."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_sparse_threshold"
type = "u32"
requirement = "optional"
default = "32768"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Context threshold for sparse prefill behavior."
secret = false
restart_impact = "none"

[[field]]
key = "prefill_threshold"
type = "u32"
requirement = "optional"
default = "32768"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Context length threshold for prefill compression."
secret = false
restart_impact = "none"

[[field]]
key = "prewarm_priority"
type = "u32"
requirement = "optional"
default = "0"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Startup background prewarm priority for a model. Set per model under model_overrides; 0 disables prewarm, higher values load earlier."
secret = false
restart_impact = "none"

[[field]]
key = "prompt_normalize"
type = "bool"
requirement = "optional"
default = "true"
scopes = ["global", "model", "request"]
mutability = "request_only"
owner = "hipfire-config"
description = "Whether prompts are normalized before tokenization."
secret = false
restart_impact = "none"

[[field]]
key = "repeat_penalty"
type = "f64"
requirement = "optional"
default = "1.05"
scopes = ["global", "model", "request"]
mutability = "request_only"
owner = "hipfire-config"
description = "Default repeat penalty for generated text."
validation = "0.0.."
secret = false
restart_impact = "none"

[[field]]
key = "resource_lock_enabled"
type = "bool"
requirement = "optional"
default = "true"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Whether hipfire serve asks the daemon to acquire physical accelerator resource locks at startup."
secret = false
restart_impact = "none"

[[field]]
key = "resource_lock_gpus"
type = "json"
requirement = "optional"
default = "[\"auto\"]"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "GPU resources to lease before HIP initialization. [\"auto\"] maps to the daemon's detected/visible HIP device."
secret = false
restart_impact = "none"

[[field]]
key = "resource_lock_npus"
type = "json"
requirement = "optional"
default = "[]"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "NPU resources to lease before accelerator initialization. [] disables NPU leases; [\"auto\"] leases every detected NPU."
secret = false
restart_impact = "none"

[[field]]
key = "resource_lock_wait_ms"
type = "u32"
requirement = "optional"
default = "0"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Milliseconds to wait for busy resource leases during daemon startup; 0 fails fast."
secret = false
restart_impact = "none"

[[field]]
key = "scheduler_system_memory_budget_bytes"
type = "u64"
requirement = "optional"
default = "0"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "System-memory budget claimed by the residency scheduler. 0 disables the budget guard."
secret = false
restart_impact = "none"

[[field]]
key = "scheduler_system_memory_headroom_bytes"
type = "u64"
requirement = "optional"
default = "0"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "System-memory headroom preserved by residency admission. 0 disables the headroom guard."
secret = false
restart_impact = "none"

[[field]]
key = "scheduler_vram_budget_bytes"
type = "u64"
requirement = "optional"
default = "0"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "VRAM budget claimed by the residency scheduler. 0 disables the budget guard."
secret = false
restart_impact = "none"

[[field]]
key = "scheduler_vram_headroom_bytes"
type = "u64"
requirement = "optional"
default = "0"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "VRAM headroom preserved by residency admission. 0 disables the headroom guard."
secret = false
restart_impact = "none"

[[field]]
key = "sdapi_max_batch_size"
type = "u32"
requirement = "optional"
default = "8"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Upper bound on SD API batch_size."
secret = false
restart_impact = "none"

[[field]]
key = "sdapi_max_dimension"
type = "u32"
requirement = "optional"
default = "4096"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Upper bound on any single SD API dimension (width/height and their highres/firstphase variants). Requests above it get a 400. The admin's DoS ceiling; clients may request smaller, never larger."
secret = false
restart_impact = "none"

[[field]]
key = "sdapi_max_n_iter"
type = "u32"
requirement = "optional"
default = "16"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Upper bound on SD API n_iter."
secret = false
restart_impact = "none"

[[field]]
key = "sdapi_max_steps"
type = "u32"
requirement = "optional"
default = "200"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Upper bound on SD API step counts (steps and hr_second_pass_steps)."
secret = false
restart_impact = "none"

[[field]]
key = "sdapi_max_total_batches"
type = "u32"
requirement = "optional"
default = "32"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Upper bound on batch_size × n_iter (total images generated per request)."
secret = false
restart_impact = "none"

[[field]]
key = "sdapi_output_root"
type = "string"
requirement = "optional"
default = "/tmp/hipfire-sdapi"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Root directory for images saved by the SD API compatibility routes (save_images: true). Client-supplied outdir_* override_settings are ignored; every SD API image write stays under this root."
secret = false
restart_impact = "none"

[[field]]
key = "temperature"
type = "f64"
requirement = "optional"
default = "0.3"
scopes = ["global", "model", "request"]
mutability = "request_only"
owner = "hipfire-config"
description = "Default sampling temperature."
validation = "0.0.."
secret = false
restart_impact = "none"

[[field]]
key = "thinking"
type = "enum(off|on)"
requirement = "optional"
default = "off"
scopes = ["global", "model", "request"]
mutability = "request_only"
owner = "hipfire-config"
description = "Reasoning/thinking display policy for compatible models."
secret = false
restart_impact = "none"

[[field]]
key = "top_p"
type = "f64"
requirement = "optional"
default = "0.8"
scopes = ["global", "model", "request"]
mutability = "request_only"
owner = "hipfire-config"
description = "Default nucleus sampling probability."
validation = "0.0..=1.0"
secret = false
restart_impact = "none"

[[field]]
key = "unsafe_allow_unauthenticated_remote"
type = "bool"
requirement = "optional"
default = "false"
scopes = ["global", "runtime"]
mutability = "static"
owner = "hipfire-config"
description = "Explicit acknowledgement required before off or optional API authentication may bind to a non-loopback address."
secret = false
restart_impact = "none"
