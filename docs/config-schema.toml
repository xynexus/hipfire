[[field]]
key = "kv_cache"
type = "enum(auto|q8|asym2|asym3|asym4|kvarn2|kvarn|kvarn4|kvarn8)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "KV-cache precision and memory policy. NOTE: asym2/asym3/asym4 are DEPRECATED — single-tier KVarN strictly dominates them (better PPL+KLD at iso-memory, both short and long ctx; see docs/plans/2026-07-12-hot-cold-hierarchical-kv-implementation.md and NEXT-STEPS Phase D). Prefer kvarn. asym is retained only for back-compat and because TriAttention/CASK eviction scoring reads the asym format."
secret = false
restart_impact = "none"

[[field]]
key = "kv_window_precision"
type = "enum(auto|f16|f32)"
requirement = "optional"
default = "auto"
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Storage dtype for the KVarN recent window (the trailing partial block held unquantised before flush). `auto` picks the narrowest dtype every consumer supports. Each value in the window is read by exactly ONE dot product per decode step before being quantised to 4-bit on flush, so f16 is ~900x tighter than the fate of the data it holds (measured Q.K rel err: f16 2.07e-4, bf16 1.67e-3, the 4-bit it becomes 1.88e-1); f16 beats bf16 because K is bounded, so mantissa outweighs exponent range. `auto` still resolves to f32 while Gpu::kvarn_attend stages the window with a 4-bytes/element dtod blit and gathers tiles from it as f32 — the fallback is announced at load. Worth ~4 MiB and ~0.1% of bandwidth on a 16-KV-layer 27B, more on a full-attention model."
secret = false
restart_impact = "none"

[[field]]
key = "lmhead_twostage"
type = "string"
requirement = "optional"
default = "\"\""
scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Two-stage lm_head decode: a coarse shortlist pass then a full-precision rescore. `q2` (2-bit tier) or `q4`; append `:<K>` to set the shortlist width. Empty disables it and the exact full-vocab GEMV runs. On Qwen3.8-27B it is a NET LOSS, for two reasons worth knowing before enabling it. (1) Under spec decode it never runs at all: the two-stage site is the batch-1 lowered decode forward, and verify scores B tokens through the batched path. (2) Under plain decode it does run and decode gets 2.7% faster (14.7 -> 15.1 tok/s) — exactly the predicted saving, since the coarse tier cuts a 675 MB head to 318 MB and that head is only 4.4% of a 15.46 GB model — but the tier is BUILT AT RUNTIME because the artifact carries none, costing ~4.2 s charged to TTFT. Breakeven is ~2350 tokens in one generation; at 160 tokens it is 25% worse end-to-end. Quantize with a coarse tier (or cache the built one) and this becomes a free 2.7%."
secret = false
restart_impact = "none"

[[field]]
key = "load_mem_check"
type = "bool"
requirement = "optional"
default = "true"
scopes = ["global", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Refuse a load whose estimated resident size will not fit in MemAvailable. On a unified-memory host an over-large load does not fail the loader — it invokes the OOM killer on whatever else is running, so turn this off only when the estimate is known to over-count (e.g. paged experts, which it does not model)."
secret = false
restart_impact = "none"
env = ["HIPFIRE_LOAD_MEM_CHECK"]

