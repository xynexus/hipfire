scopes = ["global", "model", "runtime"]
mutability = "load_time"
owner = "hipfire-config"
description = "Stream qwen3.5-MoE routed experts from host memory instead of keeping every expert resident. Lets a routed-expert artifact larger than the host's headroom load at all; costs a host-to-GPU fetch on an expert cache miss. Defaults OFF so existing deployments keep full residency."
