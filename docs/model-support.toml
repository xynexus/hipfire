# ── Diffusion (image/video denoiser) capability matrix ─────────────────────────
# A SEPARATE matrix from the [[arch]] rows above: diffusion families are graded on
# the image-generation pipeline spine (text-encoder → denoise → sampler → VAE →
# t2i), not the autoregressive prefill/dflash/mtp/kv/vision spine. Keyed by the
# diffusion arch_id (KREA2=17, QWEN_IMAGE=18, FLUX2=23); coverage is gated against
# hipfire_model::KNOWN_DIFFUSION_ARCH_IDS. The offline `-spec` crates register
# `Diffusion + Ingest` (identity + quant policy); the servable forward path lives
# in the `hipfire-diffusion` crate, which is wired end-to-end only for flux2.
#
# marks: "full" | "partial" | "none"  (same is_full() admission semantics).

[[diffusion]]
ids = [23]
label = "flux2"
family = "flux2-mmdit"
ingest = "full"
text_enc = "full"
denoise = "full"
sampler = "full"
vae = "full"
t2i = "full"
quant = "bf16·q4f16·q8f16·hfq4/6·oq4·oq4+·oq4++·oq8"
