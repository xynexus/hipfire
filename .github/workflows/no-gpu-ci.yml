name: no-gpu-ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  no-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        # tests/no-gpu-ci.sh runs ruff, mypy and pytest (see its "Python CPU
        # tests" section); all four are needed or the gate dies partway through.
        run: python -m pip install --upgrade pytest numpy ruff mypy

      - name: Run no-GPU checks
        run: ./tests/no-gpu-ci.sh
