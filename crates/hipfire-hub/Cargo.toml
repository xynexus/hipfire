[package]
name = "hipfire-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reliable HuggingFace model fetch, verify, and repair. Offline tooling — never linked into the daemon, server, or runtime hot path."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "json",
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
libc = "0.2"
