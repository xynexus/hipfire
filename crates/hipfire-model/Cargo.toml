[package]
name = "hipfire-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model artifact identity and source contracts for hipfire"

[dependencies]
hipfire-arch-api = { path = "../hipfire-arch-api" }
hipfire-config = { path = "../hipfire-config" }
hipfire-hash = { path = "../hipfire-hash" }
hipfire-prompt = { path = "../hipfire-prompt" }
byteorder = "1"
memmap2.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
# Force-links the arch `-spec` crates so `ArchRegistry` is populated in tests
# the same way it is in a served binary. Identity resolution returns None
# against an empty registry, so without this the round-trip tests would pass
# vacuously.
hipfire-arch-specs = { path = "../hipfire-arch-specs" }
