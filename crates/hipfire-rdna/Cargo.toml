[package]
name = "hipfire-rdna"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute kernel dispatch for RDNA GPUs"

[features]
deltanet = []

[dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-gpu-types = { path = "../hipfire-gpu-types" }
hipfire-primitives = { path = "../hipfire-primitives" }
libc.workspace = true

[dev-dependencies]
hipfire-kvquant = { path = "../hipfire-kvquant" }
hipfire-xdna = { path = "../hipfire-xdna" }

# The gated-DeltaNet dispatch methods are behind the `deltanet` feature, so these
# examples cannot build without it. Declaring that here keeps a bare
# `cargo clippy --all-targets` (what the commit gate runs) green instead of
# failing on three examples it was never able to compile.
[[example]]
name = "parity_gated_delta_net_f64acc"
required-features = ["deltanet"]

[[example]]
name = "parity_gated_delta_net_f64acc_routed"
required-features = ["deltanet"]

[[example]]
name = "parity_gdn_chunk"
required-features = ["deltanet"]

[[example]]
name = "parity_gemv_oq_compact_w8a8"
required-features = ["deltanet"]

[[example]]
name = "bench_gated_delta_net"
required-features = ["deltanet"]
