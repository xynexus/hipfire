[package]
name = "hipfire-coexistence"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline coexistence / compatibility tooling for hipfire: import/export, format conversion, and interop that must stay OUT of the inference binaries (daemon, server, runtime hot path) per AGENTS.md. Today: LoRA/abliteration adapter export, container conversion, and merge-into-model bundling."

[[bin]]
name = "hipfire-coexistence"
path = "src/main.rs"

[dependencies]
hipfire-steer = { path = "../hipfire-steer" }
hipfire-steer-harness = { path = "../hipfire-steer-harness" }
hipfire-lora-hfq = { path = "../hipfire-lora-hfq" }
hipfire-daemon-adapter = { path = "../hipfire-daemon-adapter" }
hipfire-quantize = { path = "../hipfire-quantize" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-model = { path = "../hipfire-model" }
hipfire-quant-format = { path = "../hipfire-quant-format" }
hipfire-rdna = { path = "../hipfire-rdna" }
hipfire-arch-gemma3 = { path = "../hipfire-arch-gemma3" }
hipfire-arch-gemma4 = { path = "../hipfire-arch-gemma4" }
hipfire-arch-cohere2 = { path = "../hipfire-arch-cohere2" }
hipfire-arch-qwen35 = { path = "../hipfire-arch-qwen35" }
hipfire-arch-zaya = { path = "../hipfire-arch-zaya" }
hipfire-primitives = { path = "../hipfire-primitives" }
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64", "alloc"] }
hipfire-hash = { path = "../hipfire-hash" }
hipfire-hub = { path = "../hipfire-hub" }
tokio = { version = "1", features = ["rt-multi-thread"] }
hipfire-lock = { path = "../hipfire-lock" }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
base64.workspace = true
blake3.workspace = true
# Already the workspace's progress idiom (hipfire-quantize, hipfire-cli), so
# this resolves to a version the lockfile already carries.
indicatif = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
hipfire-xdna = { path = "../hipfire-xdna" }
libc.workspace = true

[dev-dependencies]
# The arch-spec registry reaches the real binary transitively through
# hipfire-quantize, but rlib pruning drops the `register_arch!` registrations in
# the lib test binary, so `from_safetensors` finds no spec for the source. Link
# the aggregation crate directly for tests.
hipfire-arch-specs = { path = "../hipfire-arch-specs" }
